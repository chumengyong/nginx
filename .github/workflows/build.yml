name: Build nginx

on:
  workflow_dispatch:            # 允许在网页上手动触发
  push:
    branches: [build-nginx]     # 只在这个分支有新提交时自动触发

jobs:
  build:
    runs-on: ubuntu-latest      # 在 GitHub 提供的 Ubuntu 虚拟机上运行

    steps:
      - name: Checkout source
        uses: actions/checkout@v4   # 把 fork 里的 nginx 源码拉到虚拟机

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libpcre2-dev zlib1g-dev libssl-dev

      - name: Configure
        # 注意: git 仓库里没有根目录的 configure(那是发布 tar 包才生成的),
        # 从源码仓库构建要用 auto/configure
        run: sh auto/configure --with-http_ssl_module

      - name: Build
        run: make -j"$(nproc)"                    # 多核并行编译

      - name: Show version
        run: ./objs/nginx -V                      # 验证编译产物可用

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4          # 把编译好的 nginx 上传为构建产物
        with:
          name: nginx-${{ github.sha }}
          path: objs/nginx
